name: YouTube Login

on:
  workflow_dispatch:

jobs:
  login:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Login code
        env:
          CID: ${{ secrets.YT_CLIENT_ID }}
          SEC: ${{ secrets.YT_CLIENT_SECRET }}
          PYTHONUNBUFFERED: "1"
        run: |
          pip install requests -q
          python3 - <<'PY'
          import os, time, requests
          cid = os.environ["CID"].strip()
          sec = os.environ["SEC"].strip()
          r = requests.post("https://oauth2.googleapis.com/device/code", data={"client_id": cid, "scope": "https://www.googleapis.com/auth/youtube"}).json()
          if "device_code" not in r:
              print("ERROR:", r)
              raise SystemExit(1)
          print("=================================")
          print("1) Open: https://www.google.com/device")
          print("2) CODE:", r["user_code"])
          print("=================================")
          end = time.time() + 1500
          interval = r.get("interval", 5)
          while time.time() < end:
              time.sleep(interval)
              t = requests.post("https://oauth2.googleapis.com/token", data={"client_id": cid, "client_secret": sec, "device_code": r["device_code"], "grant_type": "urn:ietf:params:oauth:grant-type:device_code"}).json()
              if "refresh_token" in t:
                  print("TOKEN START")
                  print(t["refresh_token"])
                  print("TOKEN END")
                  break
              e = t.get("error")
              if e == "slow_down":
                  interval += 5
              elif e != "authorization_pending":
                  print("ERROR:", t)
                  raise SystemExit(1)
          else:
              print("TIME OVER - run again")
          PY
