name: YT Auto

on:
  schedule:
    - cron: "30 12 * * *"   # रोज़ शॉर्ट्स, शाम 6:00 बजे (IST)
    - cron: "30 2 */2 * *"  # हर 2 दिन में लॉन्ग, सुबह 8:00 बजे (IST)
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options: [all, fact, movies, cricket]
        default: all
      type:
        type: choice
        options: [short, long]
        default: short
      upload:
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: yt-auto
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
      type: ${{ steps.p.outputs.type }}
    steps:
      - id: p
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          IN_TYPE: ${{ inputs.type }}
          IN_CH: ${{ inputs.channel }}
        run: |
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TYPE="$IN_TYPE"; CH="$IN_CH"
          else
            if [ "$SCHEDULE" = "30 2 */2 * *" ]; then TYPE=long; else TYPE=short; fi
            CH=all
          fi
          if [ "$CH" = "all" ]; then M='["fact","movies","cricket"]'; else M="[\"$CH\"]"; fi
          echo "matrix=$M" >> "$GITHUB_OUTPUT"
          echo "type=$TYPE" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        channel: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: सिस्टम पैकेज
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core libraqm0 libfribidi0

      - name: Python पैकेज
        run: pip install -r requirements.txt

      - name: वीडियो बनाओ और अपलोड करो
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_REFRESH_TOKEN_FACT: ${{ secrets.YT_REFRESH_TOKEN_FACT }}
          YT_REFRESH_TOKEN_CRICKET: ${{ secrets.YT_REFRESH_TOKEN_CRICKET }}
          NOUPLOAD: ${{ (github.event_name == 'workflow_dispatch' && !inputs.upload) && '--no-upload' || '' }}
        run: python main.py --channel "${{ matrix.channel }}" --type "${{ needs.plan.outputs.type }}" $NOUPLOAD

      - name: टेस्ट वीडियो सेव करो (सिर्फ़ बिना अपलोड वाले रन में)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.upload }}
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.channel }}
          path: out/
          retention-days: 3

      - name: इस्तेमाल हुए टॉपिक सेव करो
        if: success()
        run: |
          git config user.name "yt-auto-bot"
          git config user.email "yt-auto-bot@users.noreply.github.com"
          [ -f used_topics.json ] && git add used_topics.json || true
          git diff --cached --quiet || { git commit -m "used topics update"; git pull --rebase; git push; }
