name: Daily Video

on:
  schedule:
    - cron: "30 11 * * *"   # रोज़ शाम 5:00 बजे (भारतीय समय)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "सिर्फ़ टेस्ट (वीडियो बने, अपलोड न हो)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core libraqm0 libfribidi0

      - name: Python packages
        run: pip install -r requirements.txt

      - name: Make video and upload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python main.py

      - name: Keep video for 3 days (देखने के लिए)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video
          path: work/final.mp4
          retention-days: 3
          if-no-files-found: ignore

      - name: Save history
        if: success()
        run: |
          git config user.name "yt-auto-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f state/history.json ]; then git add state/history.json; fi
          git diff --cached --quiet || (git commit -m "update history" && git push)
