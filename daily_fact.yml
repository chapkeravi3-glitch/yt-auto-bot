name: Daily Video - Fact India

on:
  schedule:
    - cron: "0 3,15 * * *"   # रोज़ सुबह 8:30 और रात 8:30 भारतीय समय
  workflow_dispatch:
    inputs:
      dry_run:
        description: "सिर्फ़ टेस्ट (अपलोड न हो)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: fact-channel
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-noto-core libraqm0 libfribidi0

      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Make video and upload
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN_FACT }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          CONFIG_FILE: config_fact.json
          HIST_FILE: state/history_fact.json
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: python main.py

      - name: Keep video for 3 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-fact
          path: work/final.mp4
          retention-days: 3
          if-no-files-found: ignore

      - name: Save history
        if: success()
        run: |
          git config user.name "yt-auto-bot"
          git config user.email "bot@users.noreply.github.com"
          if [ -f state/history_fact.json ]; then
            git add state/history_fact.json
          fi
          git diff --cached --quiet || (
            git commit -m "update fact history"
            git pull --rebase
            git push
          )
